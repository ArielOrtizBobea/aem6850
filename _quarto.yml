project:
  type: website
  output-dir: _site
  # Homework is withheld from the site until the instructor releases it.
  # Sources stay in the repo; nothing under assignments/ is built.
  render:
    - "**/*.qmd"
    - "!fall-2026/assignments/*.qmd"
    - "!fall-2026/assignments.qmd"

website:
  title: "AEM 6850"
  description: "AEM 6850 course site — Cornell Dyson School, Prof. Ariel Ortiz-Bobea."
  site-url: "https://arielortizbobea.github.io/aem6850/"

  # No navbar. The site identity, the search box, and the full lecture list all
  # live in the left sidebar, as on r4ds.hadley.nz — one navigation surface, not
  # two. Links out to other offerings belong on the instructor's teaching page,
  # not in this site's chrome.
  search:
    location: sidebar
    type: textbox
    copy-button: false

  sidebar:
    - title: "AEM 6850"
      style: docked
      search: true
      collapse-level: 2
      contents:
        - text: "Home"
          href: fall-2026/index.qmd
        - text: "Syllabus"
          href: fall-2026/syllabus.qmd
        - section: "Part I — Foundations"
