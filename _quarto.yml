format:
  html:
    theme:
      - cosmo
      - theme.scss
    code-copy: true
    code-overflow: wrap
    code-block-bg: true
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    css: styles.css
    anchor-sections: true
    link-external-newwindow: true
