<script>
(function () {
  const root = document.getElementById("sync19");
  const audio = root.querySelector("audio");
  // The word being spoken at time t: the last one whose start has passed.
  // (The small model gives 274 of its words no duration, so s <= t < e alone
  // would light nothing while it loops.)
  function current(words, t) {
    let k = -1;
    while (k + 1 < words.length && words[k + 1].s <= t) k++;
    return k;
  }
  const cols = [...root.querySelectorAll(".box")].map(function (box) {
    const words = sync19[box.dataset.model];
    const spans = words.map(function (x, i) {
      if (i > 0 && !/^[.,%?!']/.test(x.w)) box.append(" ");
      const sp = document.createElement("span");
      sp.textContent = x.w;
      sp.addEventListener("click", function () { audio.currentTime = x.s; update(); });
      box.append(sp);
      return sp;
    });
    return { box: box, words: words, spans: spans, k: null };
  });
  function update() {
    const t = audio.currentTime;
    cols.forEach(function (c) {
      const k = current(c.words, t);
      if (k === c.k) return;
      c.k = k;
      c.spans.forEach(function (sp, i) { sp.className = i < k ? "said" : i === k ? "now" : ""; });
      if (k >= 0) c.box.scrollTop = c.spans[k].offsetTop - c.box.clientHeight / 3;
    });
  }
  function tick() { update(); if (!audio.paused) requestAnimationFrame(tick); }
  audio.addEventListener("timeupdate", update);
  audio.addEventListener("play", tick);
})();
</script>
