<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1600 270" width="1600" height="270" font-family="Helvetica, Arial, sans-serif">
  <title>Two tags pinned to commits, and the branch main moving to each new commit</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/>
    </marker>
  </defs>

  <!-- the history: five commits, oldest on the left -->
  <line x1="120" y1="230" x2="1300" y2="230" stroke="#1b1b1b" stroke-width="4"/>
  <line x1="1302" y1="230" x2="1460" y2="230" stroke="#1b1b1b" stroke-width="3" stroke-dasharray="10 8"/>
  <g fill="#ffffff" stroke="#1b1b1b" stroke-width="4">
    <circle cx="200" cy="230" r="22"/>
    <circle cx="470" cy="230" r="22"/>
    <circle cx="740" cy="230" r="22"/>
    <circle cx="1010" cy="230" r="22"/>
    <circle cx="1280" cy="230" r="22"/>
  </g>
  <circle cx="1490" cy="230" r="22" fill="#ffffff" stroke="#999" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- commit hashes -->
  <g fill="#555" font-family="Menlo, Consolas, monospace" font-size="32" text-anchor="middle">
    <text x="200" y="295">a228ee2</text>
    <text x="470" y="295">3159ecc</text>
    <text x="740" y="295">9ae9460</text>
    <text x="1010" y="295">042175d</text>
    <text x="1280" y="295">83b87f6</text>
  </g>
  <text x="1490" y="295" text-anchor="middle" font-size="26" font-style="italic" fill="#888">next commit</text>

  <!-- tags: filled labels pinned to one commit each -->
  <g stroke="#b31b1b" stroke-width="3">
    <line x1="470" y1="152" x2="470" y2="208"/>
    <line x1="1010" y1="152" x2="1010" y2="208"/>
  </g>
  <rect x="340" y="98" width="260" height="54" rx="6" fill="#b31b1b"/>
  <rect x="905" y="98" width="210" height="54" rx="6" fill="#b31b1b"/>
  <g fill="#ffffff" font-family="Menlo, Consolas, monospace" font-size="32" font-weight="bold" text-anchor="middle">
    <text x="470" y="136">v1-submitted</text>
    <text x="1010" y="136">v2-revised</text>
  </g>
  <text x="470" y="76" text-anchor="middle" fill="#b31b1b" font-size="32" font-style="italic">tag: stays on its commit</text>

  <!-- the branch main: an outlined label that moves to each new commit -->
  <line x1="1280" y1="152" x2="1280" y2="208" stroke="#1b1b1b" stroke-width="3"/>
  <rect x="1215" y="98" width="130" height="54" rx="27" fill="#ffffff" stroke="#1b1b1b" stroke-width="3"/>
  <text x="1280" y="136" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="32" font-weight="bold" fill="#1b1b1b">main</text>
  <line x1="1352" y1="125" x2="1462" y2="125" stroke="#1b1b1b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/>
  <text x="1590" y="76" text-anchor="end" font-size="32" font-style="italic" fill="#1b1b1b">branch: moves to each new commit</text>
</svg>
