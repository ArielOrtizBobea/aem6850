<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 450" width="1600" height="450" font-family="Helvetica, Arial, sans-serif">
  <title>Where the numbers in the draft paper come from</title>
  <defs>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b31b1b"/>
    </marker>
    <marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/>
    </marker>
  </defs>

  <!-- where the numbers come from -->
  <g fill="#ffffff" stroke="#1b1b1b" stroke-width="3">
    <rect x="40" y="50" width="430" height="100" rx="10"/>
    <rect x="40" y="200" width="430" height="76" rx="10"/>
    <rect x="40" y="300" width="430" height="76" rx="10"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="32" font-weight="bold" fill="#1b1b1b" text-anchor="middle">
    <text x="255" y="94">R's Console</text>
    <text x="255" y="249">output/table1.csv</text>
    <text x="255" y="349">output/figure1.pdf</text>
  </g>
  <text x="255" y="132" text-anchor="middle" font-size="28" font-style="italic" fill="#555">nothing saved</text>

  <!-- the paper -->
  <rect x="820" y="5" width="740" height="430" rx="6" fill="#fafaf7" stroke="#1b1b1b" stroke-width="3"/>
  <text x="1190" y="47" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="32" font-weight="bold" fill="#1b1b1b">paper/draft.tex</text>
  <g fill="#ffffff" stroke="#bbb" stroke-width="2">
    <rect x="845" y="68" width="690" height="60" rx="6"/>
    <rect x="845" y="138" width="690" height="60" rx="6"/>
    <rect x="845" y="208" width="690" height="60" rx="6"/>
    <rect x="845" y="278" width="690" height="60" rx="6"/>
    <rect x="845" y="348" width="690" height="60" rx="6"/>
  </g>
  <g font-size="30" fill="#1b1b1b" font-weight="bold">
    <text x="865" y="108">Abstract</text>
    <text x="865" y="178">Results</text>
    <text x="865" y="248">Table 1</text>
    <text x="865" y="318">Figure 1</text>
    <text x="865" y="388">Note</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="28" fill="#b31b1b">
    <text x="1060" y="107">49.1, 67.0, 0.73</text>
    <text x="1060" y="177">39.6, 82.6, 42.8, 14.9, …</text>
    <text x="1060" y="247">52  54.8  1,452  …</text>
    <text x="1060" y="387">Gapminder, 2002</text>
  </g>
  <text x="1060" y="317" font-size="28" font-style="italic" fill="#555">the file itself, by \includegraphics</text>

  <!-- copied by hand: dashed red; read by the paper: solid -->
  <g fill="none" stroke="#b31b1b" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#ahr)">
    <path d="M 472 85 C 640 85, 690 98, 838 98"/>
    <path d="M 472 105 C 640 120, 690 168, 838 168"/>
    <path d="M 472 130 C 640 170, 690 232, 838 232"/>
    <path d="M 472 238 C 640 238, 690 244, 838 244"/>
  </g>
  <path d="M 472 338 C 640 338, 690 308, 838 308" fill="none" stroke="#1b1b1b" stroke-width="3" marker-end="url(#ahk)"/>

  <!-- legend -->
  <g font-size="28" fill="#1b1b1b">
    <line x1="40" y1="420" x2="120" y2="420" stroke="#b31b1b" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="135" y="430">typed by hand</text>
    <line x1="400" y1="420" x2="480" y2="420" stroke="#1b1b1b" stroke-width="3"/>
    <text x="495" y="430">read from the file</text>
  </g>
</svg>
