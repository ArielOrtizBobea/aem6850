<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="Helvetica, Arial, sans-serif">
  <title>Data and code policies at economics journals, 2000 to 2026</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/>
    </marker>
  </defs>

  <!-- time axis: x = 70 + (year - 2000) * 57 -->
  <line x1="50" y1="380" x2="1590" y2="380" stroke="#1b1b1b" stroke-width="4" marker-end="url(#ah)"/>

  <!-- a tick for every year; longer ticks and labels every ten years -->
  <g stroke="#888" stroke-width="2">
    <line x1="70" y1="372" x2="70" y2="388"/><line x1="127" y1="372" x2="127" y2="388"/>
    <line x1="184" y1="372" x2="184" y2="388"/><line x1="241" y1="372" x2="241" y2="388"/>
    <line x1="298" y1="372" x2="298" y2="388"/><line x1="355" y1="372" x2="355" y2="388"/>
    <line x1="412" y1="372" x2="412" y2="388"/><line x1="469" y1="372" x2="469" y2="388"/>
    <line x1="526" y1="372" x2="526" y2="388"/><line x1="583" y1="372" x2="583" y2="388"/>
    <line x1="640" y1="372" x2="640" y2="388"/><line x1="697" y1="372" x2="697" y2="388"/>
    <line x1="754" y1="372" x2="754" y2="388"/><line x1="811" y1="372" x2="811" y2="388"/>
    <line x1="868" y1="372" x2="868" y2="388"/><line x1="925" y1="372" x2="925" y2="388"/>
    <line x1="982" y1="372" x2="982" y2="388"/><line x1="1039" y1="372" x2="1039" y2="388"/>
    <line x1="1096" y1="372" x2="1096" y2="388"/><line x1="1153" y1="372" x2="1153" y2="388"/>
    <line x1="1210" y1="372" x2="1210" y2="388"/><line x1="1267" y1="372" x2="1267" y2="388"/>
    <line x1="1324" y1="372" x2="1324" y2="388"/><line x1="1381" y1="372" x2="1381" y2="388"/>
    <line x1="1438" y1="372" x2="1438" y2="388"/><line x1="1495" y1="372" x2="1495" y2="388"/>
    <line x1="1552" y1="372" x2="1552" y2="388"/>
  </g>
  <g stroke="#1b1b1b" stroke-width="3">
    <line x1="70" y1="364" x2="70" y2="396"/>
    <line x1="640" y1="364" x2="640" y2="396"/>
    <line x1="1210" y1="364" x2="1210" y2="396"/>
  </g>
  <g fill="#555" font-size="30" text-anchor="middle">
    <text x="70" y="430">2000</text>
    <text x="640" y="430">2010</text>
    <text x="1210" y="430">2020</text>
  </g>

  <!-- leader lines from each event to its label -->
  <g stroke="#999" stroke-width="2">
    <line x1="241" y1="368" x2="241" y2="336"/>
    <line x1="1153" y1="368" x2="1153" y2="296"/>
    <line x1="583" y1="368" x2="583" y2="144"/>
    <line x1="1438" y1="368" x2="1438" y2="144"/>
    <line x1="298" y1="392" x2="298" y2="455"/>
    <line x1="1096" y1="392" x2="1096" y2="455"/>
    <line x1="1324" y1="392" x2="1324" y2="455"/>
  </g>

  <!-- events on the axis -->
  <g fill="#b31b1b">
    <circle cx="241" cy="380" r="12"/>
    <circle cx="298" cy="380" r="12"/>
    <circle cx="583" cy="380" r="12"/>
    <circle cx="1096" cy="380" r="12"/>
    <circle cx="1153" cy="380" r="12"/>
    <circle cx="1324" cy="380" r="12"/>
  </g>
  <line x1="1381" y1="380" x2="1495" y2="380" stroke="#b31b1b" stroke-width="14" stroke-linecap="round"/>

  <!-- labels: the year in carnelian, then the event -->
  <g font-size="36" fill="#1b1b1b" text-anchor="middle">
    <!-- above the axis, far row -->
    <text x="583" y="48" font-weight="bold" font-size="38" fill="#b31b1b">2009</text>
    <text x="583" y="90">16 journals require</text>
    <text x="583" y="130">data and code archives</text>

    <text x="1370" y="48" font-weight="bold" font-size="38" fill="#b31b1b">2023–2025</text>
    <text x="1370" y="90">Econometric Society,</text>
    <text x="1370" y="130">JEEA and JPE adopt DCAS</text>

    <!-- above the axis, near row -->
    <text x="241" y="200" font-weight="bold" font-size="38" fill="#b31b1b">2003</text>
    <text x="241" y="242">Only half the authors</text>
    <text x="241" y="282">of one AER issue</text>
    <text x="241" y="322">share their files</text>

    <text x="1153" y="200" font-weight="bold" font-size="38" fill="#b31b1b">2019</text>
    <text x="1153" y="242">AEA checks the code</text>
    <text x="1153" y="282">before acceptance</text>

    <!-- below the axis -->
    <text x="298" y="490" font-weight="bold" font-size="38" fill="#b31b1b">2004</text>
    <text x="298" y="532">AER requires data</text>
    <text x="298" y="572">and code (from 2005)</text>

    <text x="1025" y="490" font-weight="bold" font-size="38" fill="#b31b1b">2018</text>
    <text x="1025" y="532">AEA appoints its</text>
    <text x="1025" y="572">first Data Editor</text>

    <text x="1395" y="490" font-weight="bold" font-size="38" fill="#b31b1b">2022</text>
    <text x="1395" y="532">Data editors publish</text>
    <text x="1395" y="572">a joint standard, DCAS</text>
  </g>
</svg>
