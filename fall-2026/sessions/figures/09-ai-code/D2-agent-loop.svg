<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="1600" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>The loop inside the tool</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b31b1b"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="4">
    <rect x="20"   y="30" width="280" height="170" rx="18"/>
    <rect x="340"  y="30" width="280" height="170" rx="18"/>
    <rect x="660"  y="30" width="280" height="170" rx="18"/>
    <rect x="980"  y="30" width="280" height="170" rx="18"/>
    <rect x="1300" y="30" width="280" height="170" rx="18"/>
    <line x1="300" y1="115" x2="336" y2="115" marker-end="url(#arrow)"/>
    <line x1="620" y1="115" x2="656" y2="115" marker-end="url(#arrow)"/>
    <line x1="940" y1="115" x2="976" y2="115" marker-end="url(#arrow)"/>
    <line x1="1260" y1="115" x2="1296" y2="115" marker-end="url(#arrow)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="160"  y="85" font-size="44" font-weight="bold">1 Prompt</text>
    <text x="160"  y="135" font-size="30">your text, plus</text>
    <text x="160"  y="172" font-size="30">CLAUDE.md</text>
    <text x="480"  y="85" font-size="44" font-weight="bold">2 Read</text>
    <text x="480"  y="135" font-size="30">files, folders,</text>
    <text x="480"  y="172" font-size="30">command output</text>
    <text x="800"  y="85" font-size="44" font-weight="bold">3 Act</text>
    <text x="800"  y="135" font-size="30">edit a file,</text>
    <text x="800"  y="172" font-size="30">run a command</text>
    <text x="1120" y="85" font-size="44" font-weight="bold">4 Check</text>
    <text x="1120" y="135" font-size="30">read the result,</text>
    <text x="1120" y="172" font-size="30">decide next step</text>
    <text x="1440" y="85" font-size="44" font-weight="bold">5 Reply</text>
    <text x="1440" y="135" font-size="30">when nothing</text>
    <text x="1440" y="172" font-size="30">is left to do</text>
  </g>
  <g fill="none" stroke="#b31b1b" stroke-width="4" stroke-dasharray="14 10">
    <path d="M 1120 200 L 1120 270 L 480 270 L 480 204" marker-end="url(#arrow-red)"/>
  </g>
  <text x="800" y="318" font-size="32" fill="#b31b1b" text-anchor="middle">again, until the task is done; in manual mode, step 3 asks you first</text>
</svg>
