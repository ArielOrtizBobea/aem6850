<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="Helvetica, Arial, sans-serif">
  <title>Delegation as a principal-agent problem</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="4">
    <rect x="40" y="170" width="380" height="240" rx="18"/>
    <rect x="1100" y="90" width="460" height="400" rx="18"/>
    <line x1="424" y1="225" x2="1094" y2="225" marker-end="url(#arrow)"/>
    <line x1="1096" y1="365" x2="428" y2="365" marker-end="url(#arrow)"/>
  </g>
  <rect x="1150" y="200" width="360" height="240" rx="12" fill="#cfcabd" stroke="none"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="230" y="280" font-size="52" font-weight="bold">You</text>
    <text x="230" y="330" font-size="32">the principal</text>
    <text x="1330" y="160" font-size="44" font-weight="bold">The agent</text>
    <text x="1330" y="315" font-size="36">the work</text>
    <text x="1330" y="360" font-size="28">steps you do not see</text>
    <text x="760" y="205" font-size="34">the brief</text>
    <text x="760" y="410" font-size="34">the output, and its report on the work</text>
  </g>
  <text x="800" y="560" font-size="34" text-anchor="middle" fill="#b31b1b">The agent writes the report, so the report is a claim.</text>
</svg>
