<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660" font-family="Helvetica, Arial, sans-serif">
  <title>Evidence about hidden work, weakest to strongest</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="4">
    <rect x="20"   y="500" width="300" height="140" rx="10" fill="none"/>
    <rect x="335"  y="420" width="300" height="220" rx="10" fill="none"/>
    <rect x="650"  y="340" width="300" height="300" rx="10" fill="none"/>
    <rect x="965"  y="260" width="300" height="380" rx="10" fill="none"/>
    <rect x="1280" y="180" width="300" height="460" rx="10" fill="#f3dede"/>
    <line x1="60" y1="90" x2="1540" y2="90" marker-end="url(#arrow)"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="36">
    <text x="800" y="60" font-size="38">weaker evidence  →  stronger evidence</text>
    <text x="170"  y="555">It says</text><text x="170" y="597">it is done</text>
    <text x="485"  y="475">It shows</text><text x="485" y="517">the output</text>
    <text x="800"  y="395">It shows each</text><text x="800" y="437">command and</text><text x="800" y="479">what it printed</text>
    <text x="1115" y="315">A fresh agent</text><text x="1115" y="357">recomputes from</text><text x="1115" y="399">the raw data</text>
    <text x="1430" y="235">You recompute</text><text x="1430" y="277">a value you</text><text x="1430" y="319">already know</text>
  </g>
</svg>
