<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780" font-family="Helvetica, Arial, sans-serif">
  <title>Time to do a task and time to check it</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="820" y="370" width="700" height="320" fill="#f3dede"/>
  <g fill="none" stroke="currentColor" stroke-width="4">
    <rect x="120" y="50" width="1400" height="640"/>
    <line x1="820" y1="50" x2="820" y2="690"/>
    <line x1="120" y1="370" x2="1520" y2="370"/>
    <line x1="120" y1="730" x2="1520" y2="730" marker-end="url(#arrow)"/>
    <line x1="70" y1="690" x2="70" y2="60" marker-end="url(#arrow)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="820" y="770" font-size="36">time to do it yourself</text>
    <text x="40" y="370" font-size="36" transform="rotate(-90 40 370)">time to check it</text>
    <text x="470"  y="170" font-size="46" font-weight="bold">Do it yourself</text>
    <text x="470"  y="232" font-size="36">a summary of a paper</text>
    <text x="470"  y="278" font-size="36">you have already read</text>
    <text x="1170" y="170" font-size="46" font-weight="bold">Delegate in pieces</text>
    <text x="1170" y="232" font-size="36">a literature review: every</text>
    <text x="1170" y="278" font-size="36">citation needs a lookup</text>
    <text x="470"  y="490" font-size="46" font-weight="bold">Either</text>
    <text x="470"  y="552" font-size="36">a one-line change</text>
    <text x="470"  y="598" font-size="36">to a plot</text>
    <text x="1170" y="490" font-size="46" font-weight="bold">Delegate</text>
    <text x="1170" y="552" font-size="36">reformatting forty tables;</text>
    <text x="1170" y="598" font-size="36">a scraper whose row count you know</text>
  </g>
</svg>
