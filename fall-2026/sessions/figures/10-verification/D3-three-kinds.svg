<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" font-family="Helvetica, Arial, sans-serif">
  <title>Exact, sourced, and judgment claims</title>
  <rect x="20"   y="20" width="500" height="100" rx="14" fill="#dce8f5"/>
  <rect x="550"  y="20" width="500" height="100" rx="14" fill="#dff0e0"/>
  <rect x="1080" y="20" width="500" height="100" rx="14" fill="#f7e6cc"/>
  <g fill="none" stroke-width="4">
    <rect x="20"   y="20" width="500" height="480" rx="14" stroke="#1f5f9e"/>
    <rect x="550"  y="20" width="500" height="480" rx="14" stroke="#2e7d32"/>
    <rect x="1080" y="20" width="500" height="480" rx="14" stroke="#a65f00"/>
  </g>
  <g text-anchor="middle" font-size="46" font-weight="bold">
    <text x="270"  y="88" fill="#1f5f9e">Exact</text>
    <text x="800"  y="88" fill="#2e7d32">Sourced</text>
    <text x="1330" y="88" fill="#a65f00">Judgment</text>
  </g>
  <g text-anchor="middle" font-size="32" fill="currentColor">
    <text x="270" y="190">a count, a mean,</text>
    <text x="270" y="232">a coefficient,</text>
    <text x="270" y="274">rows kept by a merge</text>
    <text x="800" y="190">a citation,</text>
    <text x="800" y="232">what a variable means,</text>
    <text x="800" y="274">a number from a report</text>
    <text x="1330" y="190">the wording,</text>
    <text x="1330" y="232">which sample, which model,</text>
    <text x="1330" y="274">a figure's design</text>
  </g>
  <g text-anchor="middle" font-size="34" font-weight="bold" fill="currentColor">
    <text x="270"  y="420">Recompute it</text>
    <text x="800"  y="420">Open the source</text>
    <text x="1330" y="400">Set your criteria,</text>
    <text x="1330" y="444">then decide</text>
  </g>
</svg>
