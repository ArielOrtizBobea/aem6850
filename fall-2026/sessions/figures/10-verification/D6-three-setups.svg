<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="Helvetica, Arial, sans-serif">
  <title>Three setups with a second agent</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="currentColor" font-size="38" font-weight="bold" text-anchor="middle">
    <text x="270" y="50">Replicate</text>
    <text x="800" y="50">Check each claim</text>
    <text x="1330" y="50">Try to refute</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="3.5">
    <!-- replicate -->
    <rect x="160" y="90" width="220" height="70" rx="10"/>
    <rect x="40" y="230" width="200" height="80" rx="10"/>
    <rect x="300" y="230" width="200" height="80" rx="10"/>
    <rect x="160" y="380" width="220" height="70" rx="10"/>
    <line x1="230" y1="160" x2="150" y2="224" marker-end="url(#arrow)"/>
    <line x1="310" y1="160" x2="390" y2="224" marker-end="url(#arrow)"/>
    <line x1="140" y1="310" x2="220" y2="374" marker-end="url(#arrow)"/>
    <line x1="400" y1="310" x2="320" y2="374" marker-end="url(#arrow)"/>
    <line x1="270" y1="450" x2="270" y2="514" marker-end="url(#arrow)"/>
    <!-- claims -->
    <rect x="600" y="90" width="180" height="70" rx="10"/>
    <rect x="820" y="90" width="180" height="70" rx="10"/>
    <rect x="690" y="230" width="220" height="80" rx="10"/>
    <rect x="640" y="380" width="320" height="70" rx="10"/>
    <line x1="690" y1="160" x2="760" y2="224" marker-end="url(#arrow)"/>
    <line x1="910" y1="160" x2="840" y2="224" marker-end="url(#arrow)"/>
    <line x1="800" y1="310" x2="800" y2="374" marker-end="url(#arrow)"/>
    <line x1="800" y1="450" x2="800" y2="514" marker-end="url(#arrow)"/>
    <!-- refute -->
    <rect x="1220" y="90" width="220" height="70" rx="10"/>
    <rect x="1190" y="230" width="280" height="80" rx="10"/>
    <rect x="1220" y="380" width="220" height="70" rx="10"/>
    <line x1="1330" y1="160" x2="1330" y2="224" marker-end="url(#arrow)"/>
    <line x1="1330" y1="310" x2="1330" y2="374" marker-end="url(#arrow)"/>
    <line x1="1330" y1="450" x2="1330" y2="514" marker-end="url(#arrow)"/>
  </g>
  <g fill="currentColor" font-size="28" text-anchor="middle">
    <text x="270" y="135">raw data</text>
    <text x="140" y="280">agent A</text>
    <text x="400" y="280">agent B</text>
    <text x="270" y="425">compare</text>
    <text x="690" y="135">write-up</text>
    <text x="910" y="135">source</text>
    <text x="800" y="280">checker</text>
    <text x="800" y="425">claim · found · match</text>
    <text x="1330" y="135">the result</text>
    <text x="1330" y="266">reviewer: find</text>
    <text x="1330" y="298">what is wrong</text>
    <text x="1330" y="425">findings</text>
  </g>
  <g fill="#b31b1b" font-size="30" text-anchor="middle">
    <text x="270" y="560">you read where</text>
    <text x="270" y="596">they differ</text>
    <text x="800" y="560">you read the</text>
    <text x="800" y="596">mismatches</text>
    <text x="1330" y="560">you confirm each</text>
    <text x="1330" y="596">finding in the data</text>
  </g>
</svg>
