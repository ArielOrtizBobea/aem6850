<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>The procedure in seven steps</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="4">
    <rect x="20"   y="20" width="440" height="520" rx="18"/>
    <rect x="530"  y="20" width="440" height="520" rx="18"/>
    <rect x="1040" y="20" width="540" height="520" rx="18"/>
    <line x1="462" y1="280" x2="524" y2="280" marker-end="url(#arrow)"/>
    <line x1="972" y1="280" x2="1034" y2="280" marker-end="url(#arrow)"/>
  </g>
  <g fill="currentColor" font-size="46" font-weight="bold" text-anchor="middle">
    <text x="240" y="88">Before</text>
    <text x="750" y="88">During</text>
    <text x="1310" y="88">After</text>
  </g>
  <g fill="currentColor" font-size="34">
    <text x="50" y="165"><tspan font-weight="bold" fill="#b31b1b">1</tspan>  Write the checks</text>
    <text x="92" y="207">into the brief</text>
    <text x="50" y="300"><tspan font-weight="bold" fill="#b31b1b">2</tspan>  Keep one value</text>
    <text x="92" y="342">you know out of it</text>
    <text x="560" y="165"><tspan font-weight="bold" fill="#b31b1b">3</tspan>  Hand over</text>
    <text x="602" y="207">small pieces</text>
    <text x="560" y="300"><tspan font-weight="bold" fill="#b31b1b">4</tspan>  Ask for evidence;</text>
    <text x="602" y="342">keep the answer</text>
    <text x="602" y="384">and the checks</text>
    <text x="602" y="426">out of its reach</text>
    <text x="1070" y="155"><tspan font-weight="bold" fill="#b31b1b">5</tspan>  Check in a fresh session</text>
    <text x="1112" y="197">with other information</text>
    <text x="1070" y="275"><tspan font-weight="bold" fill="#b31b1b">6</tspan>  Test the checker once</text>
    <text x="1112" y="317">with planted errors</text>
    <text x="1070" y="395"><tspan font-weight="bold" fill="#b31b1b">7</tspan>  Read the disagreements</text>
    <text x="1112" y="437">and a random sample;</text>
    <text x="1112" y="479">record what you checked</text>
  </g>
</svg>
