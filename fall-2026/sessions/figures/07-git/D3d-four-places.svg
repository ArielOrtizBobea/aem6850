<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="t" font-family="Helvetica, Arial, sans-serif" fill="currentColor" stroke="currentColor">
  <title id="t">Three places a change lives, and the fourth that is not on your laptop: working folder, staging area, history, GitHub</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>

  <!-- dashed return arrow: history back to the working folder -->
  <text x="600" y="44" text-anchor="middle" font-size="22" font-style="italic" stroke="none">the newest snapshot is what "clean" means</text>
  <path d="M 1080 138 L 1080 60 L 120 60 L 120 136" fill="none" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#ah)"/>

  <!-- forward arrows along the top -->
  <text x="400" y="96" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">git add</text>
  <text x="400" y="128" text-anchor="middle" font-size="18" font-style="italic" stroke="none">into the frame</text>
  <path d="M 280 138 L 280 112 L 520 112 L 520 136" fill="none" stroke-width="3" marker-end="url(#ah)"/>
  <text x="800" y="96" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">git commit -m</text>
  <text x="800" y="128" text-anchor="middle" font-size="18" font-style="italic" stroke="none">press the shutter</text>
  <path d="M 680 138 L 680 112 L 920 112 L 920 136" fill="none" stroke-width="3" marker-end="url(#ah)"/>

  <!-- column 1: working folder -->
  <rect x="40" y="140" width="320" height="200" rx="12" fill="none" stroke-width="2.5"/>
  <text x="200" y="182" text-anchor="middle" font-size="28" font-weight="bold" stroke="none">Working folder</text>
  <text x="200" y="212" text-anchor="middle" font-size="20" font-style="italic" stroke="none" opacity="0.75">the files you see in RStudio</text>
  <text x="200" y="240" text-anchor="middle" font-size="20" font-style="italic" stroke="none">= the desk</text>
  <rect x="72" y="282" width="122" height="38" rx="19" fill="none" stroke-width="1.5"/>
  <text x="133" y="309" text-anchor="middle" font-size="22" stroke="none">modified</text>
  <rect x="206" y="282" width="128" height="38" rx="19" fill="none" stroke-width="1.5"/>
  <text x="270" y="309" text-anchor="middle" font-size="22" stroke="none">untracked</text>

  <!-- column 2: staging area -->
  <rect x="440" y="140" width="320" height="200" rx="12" fill="none" stroke-width="2.5"/>
  <text x="600" y="182" text-anchor="middle" font-size="28" font-weight="bold" stroke="none">Staging area</text>
  <text x="600" y="212" text-anchor="middle" font-size="20" font-style="italic" stroke="none" opacity="0.75">what the next snapshot will include</text>
  <text x="600" y="240" text-anchor="middle" font-size="20" font-style="italic" stroke="none">= what is in the frame</text>
  <rect x="546" y="282" width="108" height="38" rx="19" fill="none" stroke-width="1.5"/>
  <text x="600" y="309" text-anchor="middle" font-size="22" stroke="none">staged</text>

  <!-- column 3: history -->
  <rect x="840" y="140" width="320" height="200" rx="12" fill="none" stroke-width="2.5"/>
  <text x="1000" y="182" text-anchor="middle" font-size="28" font-weight="bold" stroke="none">History</text>
  <text x="1000" y="212" text-anchor="middle" font-size="20" font-style="italic" stroke="none" opacity="0.75">the timeline</text>
  <text x="1000" y="240" text-anchor="middle" font-size="20" font-style="italic" stroke="none">= the album</text>
  <line x1="885" y1="301" x2="1115" y2="301" stroke-width="2.5"/>
  <circle cx="920" cy="301" r="11" stroke-width="2"/>
  <circle cx="1000" cy="301" r="11" stroke-width="2"/>
  <circle cx="1080" cy="301" r="11" stroke-width="2"/>


  <!-- column 4: GitHub, not on your laptop -->
  <rect x="1240" y="140" width="320" height="200" rx="12" fill="none" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="1400" y="182" text-anchor="middle" font-size="28" font-weight="bold" stroke="none">GitHub</text>
  <text x="1400" y="212" text-anchor="middle" font-size="20" font-style="italic" stroke="none" opacity="0.75">the copy called origin</text>
  <text x="1400" y="240" text-anchor="middle" font-size="20" font-style="italic" stroke="none">= the shared album</text>
  <line x1="1285" y1="301" x2="1515" y2="301" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle cx="1320" cy="301" r="11" stroke-width="2" opacity="0.55"/>
  <circle cx="1400" cy="301" r="11" stroke-width="2" opacity="0.55"/>
  <circle cx="1480" cy="301" r="11" stroke-width="2" opacity="0.55"/>
  <text x="1220" y="96" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">git push</text>
  <text x="1220" y="128" text-anchor="middle" font-size="18" font-style="italic" stroke="none">hand over the new photos</text>
  <path d="M 1120 138 L 1120 112 L 1320 112 L 1320 136" fill="none" stroke-width="3" marker-end="url(#ah)"/>
  <text x="1200" y="412" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">git pull</text>
  <path d="M 1320 344 L 1320 378 L 1080 378 L 1080 346" fill="none" stroke-width="3" marker-end="url(#ah)"/>

  <!-- brackets beneath: the two diffs -->
  <path d="M 210 378 L 570 378" fill="none" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="390" y="412" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">git diff</text>
  <path d="M 630 378 L 990 378" fill="none" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="810" y="412" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">git diff --staged</text>

  <!-- one wide bar: git status -->
  <rect x="40" y="450" width="1120" height="58" rx="10" fill="currentColor" fill-opacity="0.08" stroke-width="2"/>
  <text x="600" y="487" text-anchor="middle" font-size="24" stroke="none"><tspan font-weight="bold">git status</tspan> — reads these three, changes nothing, never asks GitHub</text>
</svg>
