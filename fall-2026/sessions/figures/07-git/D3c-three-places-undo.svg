<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t" font-family="Helvetica, Arial, sans-serif" fill="currentColor" stroke="currentColor">
  <title id="t">Three undo verbs, one per place: restore, restore --staged, commit --amend</title>
  <defs>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" fill-opacity="0.35" stroke="none"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b31b1b" stroke="none"/>
    </marker>
  </defs>

  <!-- the forward arrows of D3, greyed -->
  <g opacity="0.35">
    <text x="600" y="44" text-anchor="middle" font-size="22" font-style="italic" stroke="none">the newest snapshot is what "clean" means</text>
    <path d="M 1080 138 L 1080 60 L 120 60 L 120 136" fill="none" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#ahg)"/>
    <text x="400" y="100" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">git add</text>
    <path d="M 280 138 L 280 112 L 520 112 L 520 136" fill="none" stroke-width="3" marker-end="url(#ahg)"/>
    <text x="800" y="100" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">git commit -m</text>
    <path d="M 680 138 L 680 112 L 920 112 L 920 136" fill="none" stroke-width="3" marker-end="url(#ahg)"/>
  </g>

  <!-- column 1: working folder -->
  <rect x="40" y="140" width="320" height="200" rx="12" fill="none" stroke-width="2.5"/>
  <text x="200" y="182" text-anchor="middle" font-size="28" font-weight="bold" stroke="none">Working folder</text>
  <text x="200" y="212" text-anchor="middle" font-size="20" font-style="italic" stroke="none" opacity="0.75">the files you see in RStudio</text>
  <rect x="72" y="268" width="122" height="38" rx="19" fill="none" stroke-width="1.5"/>
  <text x="133" y="295" text-anchor="middle" font-size="22" stroke="none">modified</text>
  <rect x="206" y="268" width="128" height="38" rx="19" fill="none" stroke-width="1.5"/>
  <text x="270" y="295" text-anchor="middle" font-size="22" stroke="none">untracked</text>

  <!-- column 2: staging area -->
  <rect x="440" y="140" width="320" height="200" rx="12" fill="none" stroke-width="2.5"/>
  <text x="600" y="182" text-anchor="middle" font-size="28" font-weight="bold" stroke="none">Staging area</text>
  <text x="600" y="212" text-anchor="middle" font-size="20" font-style="italic" stroke="none" opacity="0.75">what the next snapshot will include</text>
  <rect x="546" y="268" width="108" height="38" rx="19" fill="none" stroke-width="1.5"/>
  <text x="600" y="295" text-anchor="middle" font-size="22" stroke="none">staged</text>

  <!-- column 3: history -->
  <rect x="840" y="140" width="320" height="200" rx="12" fill="none" stroke-width="2.5"/>
  <text x="1000" y="182" text-anchor="middle" font-size="28" font-weight="bold" stroke="none">History</text>
  <text x="1000" y="212" text-anchor="middle" font-size="20" font-style="italic" stroke="none" opacity="0.75">the timeline</text>
  <line x1="885" y1="268" x2="1115" y2="268" stroke-width="2.5"/>
  <circle cx="920" cy="268" r="11" stroke-width="2"/>
  <circle cx="1000" cy="268" r="11" stroke-width="2"/>
  <circle cx="1080" cy="268" r="11" stroke-width="2"/>

  <!-- the three reverse arrows, in colour -->
  <g stroke="#b31b1b" fill="#b31b1b">
    <!-- 1. git restore <file>: working folder, down to the bin -->
    <path d="M 90 342 L 90 374" fill="none" stroke-width="5" marker-end="url(#ahr)"/>
    <path d="M 70 384 L 110 384 M 84 384 L 84 378 L 96 378 L 96 384 M 75 384 L 79 424 L 101 424 L 105 384 M 84 392 L 85 416 M 96 392 L 95 416" fill="none" stroke-width="2.5"/>
    <text x="126" y="402" font-size="22" font-weight="bold" stroke="none">git restore &lt;file&gt;</text>
    <text x="126" y="430" font-size="22" stroke="none">throw the edit away</text>

    <!-- 2. git restore, staged: staging area back to the working folder -->
    <path d="M 660 342 L 660 376 L 320 376 L 320 348" fill="none" stroke-width="3" marker-end="url(#ahr)"/>
    <text x="490" y="404" text-anchor="middle" font-size="22" font-weight="bold" stroke="none">git restore --staged &lt;file&gt;</text>
    <text x="490" y="432" text-anchor="middle" font-size="22" stroke="none">take it back out, keep the edit</text>

    <!-- 3. git commit, amend: the last commit, back onto itself -->
    <path d="M 1062 281 A 24 24 0 1 0 1098 281" fill="none" stroke-width="3" marker-end="url(#ahr)"/>
    <text x="1000" y="404" text-anchor="middle" font-size="22" font-weight="bold" stroke="none">git commit --amend -m "…"</text>
    <text x="1000" y="432" text-anchor="middle" font-size="22" stroke="none">fix the message</text>
  </g>
</svg>
