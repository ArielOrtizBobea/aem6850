<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-labelledby="t" font-family="Helvetica, Arial, sans-serif" fill="currentColor" stroke="currentColor">
  <title id="t">A branch is a second timeline: it starts from a snapshot on main and a merge joins it back</title>
  <defs>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b31b1b" stroke="none"/>
    </marker>
  </defs>
  <g transform="translate(0 -110)">

  <!-- main: one horizontal timeline -->
  <text x="60" y="312" font-size="26" font-weight="bold" stroke="none">main</text>
  <line x1="60" y1="330" x2="1150" y2="330" stroke-width="3" marker-end="url(#ahs)"/>

  <!-- the branch: up from B, along, and back down to F -->
  <path d="M 320 330 L 470 200 L 900 200" fill="none" stroke-width="3"/>
  <text x="545" y="172" text-anchor="middle" font-size="26" font-weight="bold" stroke="none">try-new-standard</text>

  <!-- merge: E back down onto main at F -->
  <path d="M 900 200 L 1012 312" fill="none" stroke="#b31b1b" stroke-width="3" marker-end="url(#ahr)"/>
  <text x="985" y="252" font-size="26" font-weight="bold" fill="#b31b1b" stroke="none">merge</text>

  <!-- or delete the branch: a dashed X over the branch line -->
  <path d="M 818 182 L 854 218 M 854 182 L 818 218" fill="none" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="850" y="172" text-anchor="middle" font-size="22" font-style="italic" stroke="none">or delete it, and main never knew</text>

  <!-- snapshots on main -->
  <circle cx="150" cy="330" r="18" stroke-width="2.5"/>
  <text x="150" y="375" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">A</text>
  <circle cx="320" cy="330" r="18" stroke-width="2.5"/>
  <text x="320" y="375" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">B</text>
  <circle cx="500" cy="330" r="18" stroke-width="2.5"/>
  <text x="500" y="375" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">C</text>
  <circle cx="1030" cy="330" r="18" stroke-width="2.5"/>
  <text x="1030" y="375" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">F</text>

  <!-- snapshots on the branch -->
  <circle cx="600" cy="200" r="18" stroke-width="2.5"/>
  <text x="600" y="245" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">D</text>
  <circle cx="770" cy="200" r="18" stroke-width="2.5"/>
  <text x="770" y="245" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">E</text>

  <!-- three captions at the three events -->
  <text x="320" y="412" text-anchor="middle" font-size="22" font-style="italic" stroke="none">branch: starts</text>
  <text x="320" y="440" text-anchor="middle" font-size="22" font-style="italic" stroke="none">from a snapshot</text>
  <text x="685" y="412" text-anchor="middle" font-size="22" font-style="italic" stroke="none">commits on the branch</text>
  <text x="685" y="440" text-anchor="middle" font-size="22" font-style="italic" stroke="none">do not touch main</text>
  <text x="1030" y="412" text-anchor="middle" font-size="22" font-style="italic" stroke="none">merge: joins it back;</text>
  <text x="1030" y="440" text-anchor="middle" font-size="22" font-style="italic" stroke="none">F has both</text>
  </g>
</svg>
