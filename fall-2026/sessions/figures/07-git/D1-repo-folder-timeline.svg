<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t" font-family="Helvetica, Arial, sans-serif" fill="currentColor" stroke="currentColor">
  <title id="t">A repository is a folder plus a timeline of snapshots</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>

  <!-- bracket spanning both halves: repository -->
  <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" stroke="none">repository</text>
  <path d="M 60 78 L 60 64 L 1140 64 L 1140 78 M 600 64 L 600 52" fill="none" stroke-width="2.5"/>

  <!-- left third: the folder -->
  <text x="220" y="112" text-anchor="middle" font-size="24" font-style="italic" stroke="none" opacity="0.7">folder</text>
  <path d="M 80 148 L 80 132 Q 80 124 88 124 L 180 124 L 200 140 L 352 140 Q 360 140 360 148 L 360 262 Q 360 270 352 270 L 88 270 Q 80 270 80 262 Z" fill="none" stroke-width="2.5"/>
  <text x="220" y="215" text-anchor="middle" font-size="26" font-weight="bold" stroke="none">onboarding-&lt;user&gt;/</text>

  <!-- file tree beneath the folder -->
  <path d="M 110 290 L 110 372 M 110 318 L 130 318 M 110 372 L 130 372" fill="none" stroke-width="2"/>
  <text x="142" y="326" font-size="24" stroke="none">README.md</text>
  <g opacity="0.55">
    <rect x="136" y="352" width="76" height="34" rx="6" fill="none" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="174" y="377" text-anchor="middle" font-size="24" stroke="none">.git/</text>
    <text x="142" y="424" font-size="18" font-style="italic" stroke="none">hidden; holds the timeline</text>
  </g>

  <!-- thin arrow from .git/ to the timeline -->
  <path d="M 216 369 C 330 369, 380 232, 462 214" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- right two thirds: the timeline -->
  <text x="800" y="112" text-anchor="middle" font-size="24" font-style="italic" stroke="none" opacity="0.7">timeline of snapshots</text>
  <line x1="470" y1="210" x2="1130" y2="210" stroke-width="3" marker-end="url(#ah)"/>
  <text x="482" y="248" font-size="18" font-style="italic" stroke="none" opacity="0.7">oldest</text>
  <text x="1108" y="248" text-anchor="end" font-size="18" font-style="italic" stroke="none" opacity="0.7">newest</text>

  <circle cx="660" cy="210" r="18" stroke-width="2.5"/>
  <text x="660" y="288" text-anchor="middle" font-size="24" stroke="none">Initial commit</text>

  <circle cx="940" cy="210" r="18" stroke-width="2.5"/>
  <text x="940" y="288" text-anchor="middle" font-size="24" stroke="none">add my intro</text>
</svg>
