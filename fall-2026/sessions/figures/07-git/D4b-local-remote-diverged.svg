<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t" font-family="Helvetica, Arial, sans-serif" fill="currentColor" stroke="currentColor">
  <title id="t">After a browser commit and a laptop commit the two copies of the timeline differ</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <!-- your laptop -->
  <rect x="120" y="60" width="270" height="160" rx="10" fill="none" stroke-width="2.5"/>
  <rect x="132" y="72" width="246" height="136" rx="4" fill="currentColor" fill-opacity="0.06" stroke="none"/>
  <path d="M 90 236 L 120 220 L 390 220 L 420 236 Q 420 244 412 244 L 98 244 Q 90 244 90 236 Z" fill="none" stroke-width="2.5"/>
  <text x="255" y="150" text-anchor="middle" font-size="28" font-weight="bold" stroke="none">your laptop</text>
  <!-- GitHub (origin) -->
  <rect x="790" y="60" width="320" height="184" rx="14" fill="none" stroke-width="2.5"/>
  <path d="M 918 112 A 18 18 0 0 1 936 84 A 24 24 0 0 1 980 82 A 18 18 0 0 1 1000 112 Z" fill="none" stroke-width="2.5"/>
  <text x="950" y="160" text-anchor="middle" font-size="28" font-weight="bold" stroke="none">GitHub (origin)</text>
  <g transform="translate(1074 76) rotate(45)">
    <rect x="-6" y="-16" width="12" height="26" fill="none" stroke-width="2"/>
    <path d="M -6 10 L 0 20 L 6 10 Z" fill="currentColor" stroke="none"/>
    <path d="M -6 -12 L 6 -12" stroke-width="2"/>
  </g>
  <text x="950" y="200" text-anchor="middle" font-size="20" font-style="italic" stroke="none">browser edit or upload:</text>
  <text x="950" y="226" text-anchor="middle" font-size="20" font-style="italic" stroke="none">a snapshot here</text>
  <!-- three verbs between the copies -->
  <text x="605" y="96" text-anchor="middle" font-size="24" stroke="none"><tspan font-weight="bold">git clone</tspan> <tspan font-style="italic">once</tspan></text>
  <path d="M 770 110 L 448 110" fill="none" stroke-width="6" stroke-dasharray="16 10" marker-end="url(#ah)"/>
  <text x="605" y="160" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">git push</text>
  <path d="M 440 174 L 770 174" fill="none" stroke-width="2.5" marker-end="url(#ahs)"/>
  <text x="605" y="224" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">git pull</text>
  <path d="M 770 238 L 440 238" fill="none" stroke-width="2.5" marker-end="url(#ahs)"/>
  <!-- the two copies of the timeline -->
  <line x1="90" y1="330" x2="430" y2="330" stroke-width="2.5" marker-end="url(#ahs)"/>
  <circle cx="140" cy="330" r="13" stroke-width="2"/>
  <circle cx="220" cy="330" r="13" stroke-width="2"/>
  <circle cx="300" cy="330" r="13" stroke-width="2"/>
  <circle cx="380" cy="330" r="13" fill="#b31b1b" stroke="#b31b1b" stroke-width="2"/>
  <text x="380" y="372" text-anchor="middle" font-size="22" fill="#b31b1b" stroke="none">your commit</text>
  <text x="260" y="418" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">your copy</text>
  <line x1="770" y1="330" x2="1110" y2="330" stroke-width="2.5" marker-end="url(#ahs)"/>
  <circle cx="820" cy="330" r="13" stroke-width="2"/>
  <circle cx="900" cy="330" r="13" stroke-width="2"/>
  <circle cx="980" cy="330" r="13" stroke-width="2"/>
  <circle cx="1060" cy="330" r="13" fill="#b31b1b" stroke="#b31b1b" stroke-width="2"/>
  <text x="1060" y="372" text-anchor="middle" font-size="22" fill="#b31b1b" stroke="none">browser commit</text>
  <text x="940" y="418" text-anchor="middle" font-size="24" font-weight="bold" stroke="none">GitHub's copy (origin)</text>
</svg>
