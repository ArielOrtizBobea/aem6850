# Figure rules for Nature. Each rule has a value, the words it comes from,
# and the page those words are on. "not stated" means the pages are silent;
# "house" marks our own choice where they say nothing.

journal: Nature
pages:
  final: https://www.nature.com/nature/for-authors/final-submission
  guide: https://research-figure-guide.nature.com/figures/preparing-figures-our-specifications/

width_mm:
  value: {single: 89, one_and_half: 120, double: 183}
  quote: "Nature's standard figure sizes are 89 mm wide (single column) and 183 mm wide (double column). [...] Figures can also be a column-and-a-half where necessary (120–136 mm)."
  source: final

height_mm_max:
  value: 247
  quote: "The full depth of a Nature page is 247 mm."
  source: final

font:
  value: Helvetica
  quote: "Lettering should be in a sans-serif typeface, preferably Helvetica or Arial, the same font throughout all figures in the paper."
  source: final

text_pt:
  value: {min: 5, max: 7}
  quote: "Maximum text size for all other text should be 7 pt; minimum text size should be 5 pt."
  source: final

panel_label:
  value: {pt: 8, bold: true, case: lower, placement: inside}
  quote: "Separate panels in multi-part figures should each be labelled with 8 pt bold, upright (not italic) a, b, c."
  source: final (size, bold, lower case); house (letter at top left)

line_pt:
  value: {min: 0.25, max: 1}
  quote: "Line weights and strokes should be set between 0.25 and 1 pt at the final size (lines thinner than 0.25 pt may vanish in print)."
  source: final

file:
  value: {format: pdf, panels: one file}
  quote: "Adobe Illustrator (AI), Postscript, Vector EPS or PDF format for figures containing line drawings and graphs"
  source: final (format); house (all panels in one file)

text_as_text:
  value: true
  quote: "Do not rasterize or covert text to outlines."
  source: final

fonts_embedded:
  value: true
  quote: "Embed fonts (True Type 2 or 42)"
  source: guide

colour:
  value: {mode: RGB, accessible: true}
  quote: "Colour artwork can be provided in RGB (recommended) or CMYK format. / An accessible colour palette to be used (for example Wong, B. Points of view: Colour blindness. Nature Methods 8, 441 (2011).)"
  source: final, guide

axis_units:
  value: "Name (unit)"
  quote: "All axes to be labelled with units in parentheses, e.g. Data (unit)"
  source: guide
