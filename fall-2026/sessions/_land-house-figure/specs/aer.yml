# Figure rules for the American Economic Review. Each rule has a value, the
# words it comes from, and the page those words are on. The style guide sets
# the file format, letters in the names of panel files, and where source
# notes go; every other rule here is our own choice, marked source: house,
# and can be changed.

journal: American Economic Review
pages:
  style: https://www.aeaweb.org/journals/aer/style-guide

file:
  value: {format: pdf, panels: separate files}
  quote: "Figures must be supplied as vector-based graphics in one of the following formats—vector PDF, EPS, AI, WMF, or PPT."
  source: style (format); house (one file per panel, as in the file names quoted under panel_label)

panel_label:
  value: {placement: title}
  quote: "Be sure to label your figure files clearly, taking special care to use letters for indicating individual panels (e.g., Figure1a.ppt, Figure1b.ppt, Figure1c.ppt, etc.)."
  source: style (letters in file names); house ("Panel A." in the title)

notes_order:
  value: source note last
  quote: "Source notes, if any, should be placed after other notes related to the figure."
  source: style

width_mm:
  value: {panel: 115}
  quote: not stated
  source: house

font:
  value: Helvetica
  quote: not stated
  source: house

text_pt:
  value: {min: 7, max: 9}
  quote: not stated
  source: house

line_pt:
  value: {min: 0.5, max: 1.5}
  quote: not stated
  source: house

fonts_embedded:
  value: true
  quote: not stated
  source: house

colour:
  value: {mode: RGB, accessible: true, grayscale: true}
  quote: not stated
  source: house

axis_units:
  value: "Name (unit)"
  quote: not stated
  source: house
